# General
set -g clock-mode-style 12
set -g status-keys vi
set -gw mode-keys vi
set -g base-index 1
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g default-shell "/usr/bin/bash" 

# Custom Keybinds
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"

bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Alerts & Monitoring
set -g bell-action none
set -g visual-bell off
setw -g monitor-activity on

# Set colors
set -g status-bg             "default"
set -gq @thm_bar_bg          "default"

set -gq @thm_bg              "default"
set -gq @thm_fg              "default"
set -gq @thm_primary         "colour4"
set -gq @thm_inverse_primary "colour0"
set -gq @thm_surface_low     "default"
set -gq @thm_surface         "default"
set -gq @thm_surface_variant "default"
set -gq @thm_outline         "colour8"
set -gq @thm_text_variant    "default"

set -g status-style                       "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style                "bg=#{@thm_bg},fg=#{@thm_fg}"

# Styles & Colors
# setw -g clock-mode-colour "#{@thm_primary}"
set -g message-command-style "fg=#{@thm_text_variant},bg=#{@thm_bg}"
set -g message-style "fg=#{@thm_text_variant},bg=#{@thm_bg}"
set -g mode-style "bg=#{@thm_primary},fg=#{@thm_bg}"

# Status Bar Configuration
set-option -g status-justify absolute-centre
set -g status-interval 2
set -g status-position bottom

set -g status-left "#[bold]● #S #[nobold]"
set -g status-left-style "fg=#{@thm_outline}"
set -g status-left-length 40
set -g status-right ""
set -g status-right-length 0

# Window Status Formatting
setw -g window-status-format '#[fg=#{@thm_outline},bg=#{@thm_bg},bold]· #W:#I'
setw -g window-status-current-format '#[bg=#{@thm_bg},fg=#{@thm_primary},bold]• #W:#I'
setw -g window-status-activity-style none

# Pane Borders
set -g pane-border-style "fg=#{@thm_fg},bg=#{@thm_bg}"
set -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_fg}
